<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Stamp Processor v2</title>
</head>
<body style="background: #ccc; font-family: sans-serif; padding: 20px;">
  <h2>Stamp Processor v2</h2>
  <div id="log">Loading...</div>
  <div style="display: flex; gap: 20px; margin-top: 20px;">
    <div>
      <h3>Original</h3>
      <canvas id="orig" width="1254" height="1254" style="width: 400px; height: 400px; border: 1px solid #333; background: #fff;"></canvas>
    </div>
    <div>
      <h3>Cleaned</h3>
      <canvas id="cleaned" width="1254" height="1254" style="width: 400px; height: 400px; border: 1px solid #333; background: #fff;"></canvas>
    </div>
  </div>

  <script>
    async function process() {
      const log = document.getElementById('log');
      try {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        // Add timestamp to bypass any cache
        img.src = '/isn new stamp.png?' + Date.now();
        await new Promise((resolve, reject) => {
          img.onload = resolve;
          img.onerror = reject;
        });

        const origCanvas = document.getElementById('orig');
        const origCtx = origCanvas.getContext('2d');
        origCtx.drawImage(img, 0, 0);

        const imgData = origCtx.getImageData(0, 0, 1254, 1254);
        const data = imgData.data;

        const cleanedCanvas = document.getElementById('cleaned');
        const cleanedCtx = cleanedCanvas.getContext('2d');
        const cleanedImgData = cleanedCtx.createImageData(1254, 1254);
        const cData = cleanedImgData.data;

        const cx = 627;
        const cy = 627;

        for (let y = 0; y < 1254; y++) {
          for (let x = 0; x < 1254; x++) {
            const idx = (y * 1254 + x) * 4;
            const r = data[idx];
            const g = data[idx + 1];
            const b = data[idx + 2];
            const a = data[idx + 3];

            const dx = x - cx;
            const dy = y - cy;
            const dist = Math.sqrt(dx * dx + dy * dy);

            let remove = false;

            // 1. Remove GST text along bottom arc:
            // Between dotted circle (r=436) and thin outer circle (r=530), where dy > 160
            if (dy > 160 && dist >= 436 && dist <= 530) {
              remove = true;
            }

            // 2. Remove Address text & horizontal divider line:
            // Starts below laurel leaves and bottom star (y >= 810) down to dotted circle (dist <= 433)
            // Laurel leaves end around y=805.
            if (y >= 810 && dist <= 435) {
              remove = true;
            }

            if (remove) {
              // Completely transparent
              cData[idx] = 255;
              cData[idx + 1] = 255;
              cData[idx + 2] = 255;
              cData[idx + 3] = 0;
            } else {
              // Background transparency:
              // If pixel is near-white (background of stamp), make it transparent
              const isWhite = (r > 230 && g > 230 && b > 230);
              if (isWhite) {
                cData[idx] = 255;
                cData[idx + 1] = 255;
                cData[idx + 2] = 255;
                cData[idx + 3] = 0;
              } else {
                cData[idx] = r;
                cData[idx + 1] = g;
                cData[idx + 2] = b;
                cData[idx + 3] = a;
              }
            }
          }
        }

        cleanedCtx.putImageData(cleanedImgData, 0, 0);

        // Send to /api/save-stamp
        const dataUrl = cleanedCanvas.toDataURL('image/png');
        const saveRes = await fetch('/api/save-stamp', {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: dataUrl
        });
        const saveJson = await saveRes.json();
        log.innerHTML = `<strong style="color: green;">SUCCESS_V2: Saved cleaned stamp (${saveJson.size} bytes).</strong>`;

      } catch (err) {
        log.innerHTML = `<strong style="color: red;">Error: ${err.message}</strong>`;
      }
    }

    process();
  </script>
</body>
</html>
